name: 🧪 Run Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # package.json says engines >= 18, but this package cannot honour that:
      # cheerio is a *runtime* dependency here and cheerio 1.2.0 itself
      # declares engines >= 20.18.1 (it pulls in undici, which needs a global
      # `File`). So unlike the repos where cheerio is dev-only, consumers on
      # Node 18 are genuinely affected, not just CI.
      #
      # Testing 18 would therefore fail for a real reason. Raising engines to
      # >= 20 is the actual fix, but that is a major bump and a fleet-wide
      # decision — tracked in audit/NEXT-STEPS.md for Session 7.
      matrix:
        node-version: [20, 22]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test
