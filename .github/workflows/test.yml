name: 🧪 Run Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Matches engines: >= 20.18.1. cheerio is a runtime dependency here, and
      # every current cheerio 1.x pulls in an undici needing a global `File`
      # (Node 20+), so this package genuinely cannot run on Node 18 — unlike
      # the repos where cheerio is dev-only and the problem is CI-only.
      matrix:
        node-version: [20, 22]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test
